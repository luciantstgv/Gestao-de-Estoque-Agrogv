{% extends 'base.html' %}{% block content %}<h1>Produtos em alerta</h1><table><tr><th>Produto</th><th>Lote</th><th>Validade</th><th>Dias</th><th>Status</th><th>Qtd</th></tr>{% for a in alerts %}<tr><td>{{a.product_name}}</td><td>{{a.lot_number}}</td><td>{{a.expiry_date}}</td><td>{{a.days}}</td><td><span class="tag {{a.validity|lower}}">{{a.validity}}</span></td><td>{{a.quantity_current}}</td></tr>{% endfor %}</table>{% endblock %}
