{% extends 'base.html' %}{% block content %}<h1>Lançamento de vendas</h1>
{% if error %}<div class="error">{{error}}</div>{% endif %}
<form method="post" class="grid"><input name="sale_date" type="date" required><input name="sale_number" placeholder="Número da venda/pedido" required><input name="client_name" placeholder="Cliente"><select name="product_id" required>{% for p in products %}<option value="{{p.id}}">{{p.internal_code}} - {{p.name}}</option>{% endfor %}</select><input name="quantity" type="number" step="0.01" placeholder="Qtd vendida" required><input name="unit_value" type="number" step="0.01" placeholder="Valor unitário" required><input name="seller" placeholder="Vendedor"><input name="notes" placeholder="Observações"><button>Salvar venda</button></form>
<table><tr><th>Data</th><th>Nº venda</th><th>Produto</th><th>Qtd</th><th>Vlr unit.</th><th>Total</th></tr>{% for s in sales %}<tr><td>{{s.sale_date}}</td><td>{{s.sale_number}}</td><td>{{s.product_name}}</td><td>{{s.quantity}}</td><td>{{s.unit_value}}</td><td>{{s.total_value}}</td></tr>{% endfor %}</table>{% endblock %}
