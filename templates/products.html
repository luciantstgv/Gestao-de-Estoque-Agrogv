{% extends 'base.html' %}{% block content %}<h1>Produtos</h1>
<form method="post" class="grid">
<input name="internal_code" placeholder="Código interno" required><input name="barcode" placeholder="Código de barras"><input name="name" placeholder="Nome" required><input name="description" placeholder="Descrição"><input name="category" placeholder="Categoria"><input name="unit" placeholder="Unidade"><input name="brand" placeholder="Marca/Fabricante"><input name="supplier" placeholder="Fornecedor"><input name="cost_value" type="number" step="0.01" placeholder="Valor de custo"><input name="sale_value" type="number" step="0.01" placeholder="Valor de venda"><input name="min_stock" type="number" step="0.01" placeholder="Estoque mínimo"><input name="notes" placeholder="Observações"><button>Salvar produto</button></form>
<table><tr><th>Código</th><th>Nome</th><th>Categoria</th><th>Fornecedor</th><th>Custo</th><th>Venda</th><th>Mínimo</th><th>Status</th></tr>{% for p in products %}<tr><td>{{p.internal_code}}</td><td>{{p.name}}</td><td>{{p.category}}</td><td>{{p.supplier}}</td><td>{{p.cost_value}}</td><td>{{p.sale_value}}</td><td>{{p.min_stock}}</td><td>{{p.status}}</td></tr>{% endfor %}</table>{% endblock %}
