{% extends 'base.html' %}{% block content %}<h1>Lotes</h1><form method="post" class="grid"><select name="product_id" required>{% for p in products %}<option value="{{p.id}}">{{p.internal_code}} - {{p.name}}</option>{% endfor %}</select><input name="lot_number" placeholder="Número do lote" required><input name="quantity_initial" type="number" step="0.01" placeholder="Qtd inicial" required><input name="quantity_current" type="number" step="0.01" placeholder="Qtd atual"><input name="manufacturing_date" type="date"><input name="expiry_date" type="date" required><input name="location" placeholder="Localização física" required><input name="checked_by" placeholder="Responsável"><input name="checked_at" type="date"><input name="notes" placeholder="Observações"><button>Salvar lote</button></form><table><tr><th>Produto</th><th>Lote</th><th>Qtd atual</th><th>Validade</th><th>Status</th></tr>{% for l in lots %}<tr class="{% if l.quantity_current <=0 %}esgotado{% endif %}"><td>{{l.product_name}}</td><td>{{l.lot_number}}</td><td>{{l.quantity_current}}</td><td>{{l.expiry_date}}</td><td><span class="tag {{l.validity|lower}}">{{l.validity}}</span></td></tr>{% endfor %}</table>{% endblock %}
